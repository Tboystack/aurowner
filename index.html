<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Priscilla - Aurowner</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(-45deg, #ff6ec4, #7873f5, #4adede, #ff9a8b);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 20px;
      overflow-y: auto;
    }
    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    .typewriter {
      font-size: 1.3em;
      margin: 15px 0;
      white-space: pre-wrap;
      border-right: .15em solid #fff;
      animation: blinkCursor 0.8s infinite;
      display: inline-block;
    }
    @keyframes blinkCursor {
      from {border-color: transparent;}
      to {border-color: white;}
    }
    .btn {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #7873f5;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      opacity: 0;
      display: inline-block;
    }
    .btn:hover {
      background: #4adede;
      transform: scale(1.05);
    }
    .note {
      margin-top: 20px;
      font-size: 1.1em;
      opacity: 0;
    }
    .note a {
      color: #25D366;
      font-weight: bold;
      text-decoration: none;
      animation: glowPulse 1.5s infinite;
    }
    @keyframes glowPulse {
      0% {text-shadow: 0 0 5px #25D366;}
      50% {text-shadow: 0 0 20px #25D366;}
      100% {text-shadow: 0 0 5px #25D366;}
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div id="textContainer"></div>
  <button class="btn" id="secureBtn" onclick="location.href='secure.html'">View Secured Info</button>
  <p class="note" id="note">
    To view secured info, purchase code from 
    <a href="https://wa.me/2347041829634?text=Hi,%20I%20want%20to%20purchase%20the%20code%20to%20view%20Priscilla's%20info" target="_blank">
      Purchase Code
    </a>
  </p>

  <audio id="keySound" src="typewriter-key.mp3"></audio>
  <audio id="chimeSound" src="chime.mp3"></audio>

  <script>
    const lines = [
      "🎉 Introducing the Legend Herself: Priscilla popurlarly known as Aurowner👌🎉",
      "As we all know, Priscilla is not just a person—she’s a phenomenon. The youngest, richest, tallest, and most beautiful human to ever grace July 15th with her presence. At only 15 years old, she has already achieved what most of us can only dream of:",
      "• She’s so tall, clouds ask her for directions.",
      "• She’s so rich, even Monopoly money feels insecure.",
      "• She’s so beautiful, mirrors applaud when she walks by.",
      "• And she’s so young, yet somehow already the CEO of being fabulous.",
      "Rumor has it, when Priscilla enters a room, Wi‑Fi gets stronger, food tastes better, and everyone suddenly remembers their passwords. Truly, she’s the friend we all brag about knowing.",
      "So here’s to Aurowner—proof that greatness doesn’t wait for adulthood. 🌟"
    ];

    const container = document.getElementById("textContainer");
    const keySound = document.getElementById("keySound");
    const chimeSound = document.getElementById("chimeSound");
    const secureBtn = document.getElementById("secureBtn");
    const note = document.getElementById("note");

    let lineIndex = 0;
    let charIndex = 0;

    function typeLine() {
      if(lineIndex < lines.length) {
        if(charIndex === 0) {
          const span = document.createElement("div");
          span.className = "typewriter";
          container.appendChild(span);
        }
        const currentSpan = container.lastChild;
        currentSpan.textContent += lines[lineIndex].charAt(charIndex);

        keySound.currentTime = 0;
        keySound.play();

        charIndex++;
        if(charIndex < lines[lineIndex].length) {
          setTimeout(typeLine, 40); // fast typing speed
        } else {
          chimeSound.play();
          charIndex = 0;
          lineIndex++;
          setTimeout(typeLine, 400); // pause before next line
        }
      } else {
        // After all lines typed, fade in button and then note
        secureBtn.style.animation = "fadeIn 1s forwards";
        setTimeout(() => {
          note.style.animation = "fadeIn 1s forwards";
        }, 1200);
      }
    }

    window.onload = typeLine;
  </script>
</body>
</html>
