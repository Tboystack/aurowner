<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Priscilla - Aurowner</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(-45deg, #ff6ec4, #7873f5, #4adede, #ff9a8b);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 20px;
      overflow-y: auto;
    }
    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }
    .typewriter {
      font-size: 1.4em;
      margin: 15px 0;
      white-space: pre-wrap;
      border-right: .15em solid #fff;
      animation: blinkCursor 0.8s infinite;
      display: inline-block;
    }
    @keyframes blinkCursor {
      from {border-color: transparent;}
      to {border-color: white;}
    }
    .btn {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #7873f5;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover {
      background: #4adede;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div id="textContainer"></div>
  <button class="btn" onclick="location.href='secure.html'">View Secured Info</button>

  <audio id="keySound" src="typewriter-key.mp3"></audio>
  <audio id="chimeSound" src="chime.mp3"></audio>

  <script>
    const lines = [
      "🎉 Introducing the Legend Herself: Priscilla (Aurowner) 🎉",
      "As we all know, Priscilla is not just a person—she’s a phenomenon. The youngest, richest, tallest, and most beautiful human to ever grace July 15th with her presence. At only 15 years old, she has already achieved what most of us can only dream of:",
      "• She’s so tall, clouds ask her for directions.",
      "• She’s so rich, even Monopoly money feels insecure.",
      "• She’s so beautiful, mirrors applaud when she walks by.",
      "• And she’s so young, yet somehow already the CEO of being fabulous.",
      "Rumor has it, when Priscilla enters a room, Wi‑Fi gets stronger, food tastes better, and everyone suddenly remembers their passwords. Truly, she’s the friend we all brag about knowing.",
      "So here’s to Aurowner—proof that greatness doesn’t wait for adulthood. 🌟"
    ];

    const container = document.getElementById("textContainer");
    const keySound = document.getElementById("keySound");
    const chimeSound = document.getElementById("chimeSound");

    let lineIndex = 0;
    let charIndex = 0;

    function typeLine() {
      if(lineIndex < lines.length) {
        // Create a span for this line if not exists
        if(charIndex === 0) {
          const span = document.createElement("div");
          span.className = "typewriter";
          container.appendChild(span);
        }
        const currentSpan = container.lastChild;
        currentSpan.textContent += lines[lineIndex].charAt(charIndex);

        keySound.currentTime = 0;
        keySound.play();

        charIndex++;
        if(charIndex < lines[lineIndex].length) {
          setTimeout(typeLine, 100);
        } else {
          // Finished this line
          chimeSound.play();
          charIndex = 0;
          lineIndex++;
          setTimeout(typeLine, 800); // pause before next line
        }
      }
    }

    window.onload = typeLine;
  </script>
</body>
</html>
